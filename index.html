<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#86152D" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Nombre al agregar a la pantalla de inicio: iOS/iPadOS (Safari) no
         siempre respeta el "name"/"short_name" del manifest para esto, usa
         esta meta como fuente de verdad - Android/Windows sí usan el
         manifest. application-name es el fallback que toma Windows/Edge
         si por algún motivo no llega a leer el manifest. -->
    <meta name="apple-mobile-web-app-title" content="FAT Gestión" />
    <meta name="application-name" content="FAT Gestión" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>FAT Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
